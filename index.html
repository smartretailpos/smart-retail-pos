<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f766e"
  >

  <title>Smart Retail POS</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="icon"
    href="./icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icon-192.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #ecfdf5,
          #f8fafc
        );

      color: #172033;
    }

    .app-card {
      width: min(420px, 100%);

      padding: 34px 26px;

      border-radius: 26px;

      background: #ffffff;

      text-align: center;

      box-shadow:
        0 24px 70px
        rgba(15, 23, 42, 0.14);
    }

    .logo {
      width: 92px;
      height: 92px;

      margin:
        0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 24px;

      background: #0f766e;

      box-shadow:
        0 14px 30px
        rgba(15, 118, 110, 0.25);
    }

    .logo svg {
      width: 76px;
      height: 76px;
    }

    h1 {
      margin: 0;

      font-size: 25px;
      font-weight: 850;
    }

    .subtitle {
      margin:
        9px 0 25px;

      color: #667085;

      font-size: 13px;
      line-height: 1.6;
    }

    .features {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 25px;
    }

    .feature {
      padding:
        7px 10px;

      border-radius: 999px;

      background: #f0fdfa;

      color: #0f766e;

      font-size: 10px;
      font-weight: 750;
    }

    .button {
      width: 100%;

      margin-top: 10px;

      padding:
        14px 18px;

      border: 0;
      border-radius: 13px;

      font-family: inherit;
      font-size: 14px;
      font-weight: 800;

      cursor: pointer;
    }

    #installButton {
      display: none;

      background:
        linear-gradient(
          135deg,
          #134e4a,
          #0f766e
        );

      color: #ffffff;
    }

    #openButton {
      background: #f0fdfa;

      border:
        1px solid #99f6e4;

      color: #115e59;
    }

    .status {
      margin-top: 18px;

      color: #98a2b3;

      font-size: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="app-card">

    <div class="logo">

      <svg
        viewBox="0 0 64 64"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect
          x="13"
          y="9"
          width="38"
          height="43"
          rx="7"
          fill="#ffffff"
        />

        <rect
          x="19"
          y="15"
          width="26"
          height="11"
          rx="3"
          fill="#ccfbf1"
        />

        <path
          d="M22 20h20"
          stroke="#0f766e"
          stroke-width="3"
          stroke-linecap="round"
        />

        <rect
          x="20"
          y="31"
          width="7"
          height="7"
          rx="2"
          fill="#14b8a6"
        />

        <rect
          x="29"
          y="31"
          width="7"
          height="7"
          rx="2"
          fill="#fbbf24"
        />

        <rect
          x="38"
          y="31"
          width="7"
          height="7"
          rx="2"
          fill="#34d399"
        />

        <text
          x="32"
          y="47"
          text-anchor="middle"
          font-size="8"
          font-family="Arial"
          font-weight="900"
          fill="#0f766e"
        >
          POS
        </text>
      </svg>

    </div>


    <h1>
      Smart Retail POS
    </h1>


    <p class="subtitle">
      Fast and secure access to your
      business POS system.
    </p>


    <div class="features">

      <span class="feature">
        ✓ Secure
      </span>

      <span class="feature">
        ⚡ Quick Access
      </span>

      <span class="feature">
        📱 Mobile Ready
      </span>

    </div>


    <button
      id="installButton"
      class="button"
      type="button"
    >
      Install Smart Retail POS
    </button>


    <button
      id="openButton"
      class="button"
      type="button"
    >
      Open POS
    </button>


    <div
      id="status"
      class="status"
    >
      Smart Retail POS
    </div>

  </main>


  <script>
    (function () {

      'use strict';


      const POS_URL =
        'https://script.google.com/macros/s/AKfycbwopxPSHQywxSKs8zAgb5h_7EPBa9-na2z5wKSI2V3hpDQ3RnjKMccSGhzLoIJM8TTVTw/exec';


      const installButton =
        document.getElementById(
          'installButton'
        );


      const openButton =
        document.getElementById(
          'openButton'
        );


      const status =
        document.getElementById(
          'status'
        );


      let deferredPrompt =
        null;


      function isInstalled() {

        return (
          (
            window.matchMedia &&
            window.matchMedia(
              '(display-mode: standalone)'
            ).matches
          ) ||
          window.navigator.standalone ===
            true
        );

      }


      function openPOS() {

        window.location.href =
          POS_URL;

      }


      /*
       * Home Screen icon se launch hone par
       * POS automatically open hoga.
       */
      if (
        isInstalled()
      ) {

        status.textContent =
          'Opening POS...';


        setTimeout(
          openPOS,
          700
        );

      }


      window.addEventListener(
        'beforeinstallprompt',
        function (event) {

          event.preventDefault();


          deferredPrompt =
            event;


          installButton.style.display =
            'block';

        }
      );


      installButton.addEventListener(
        'click',
        async function () {

          if (
            !deferredPrompt
          ) {

            return;

          }


          deferredPrompt.prompt();


          const result =
            await deferredPrompt
              .userChoice;


          deferredPrompt =
            null;


          installButton.style.display =
            'none';


          if (
            result.outcome ===
            'accepted'
          ) {

            status.textContent =
              'Smart Retail POS installed successfully.';

          }

        }
      );


      openButton.addEventListener(
        'click',
        openPOS
      );


      window.addEventListener(
        'appinstalled',
        function () {

          installButton.style.display =
            'none';


          status.textContent =
            'Smart Retail POS installed successfully.';

        }
      );


      if (
        'serviceWorker' in navigator
      ) {

        window.addEventListener(
          'load',
          function () {

            navigator
              .serviceWorker
              .register(
                './sw.js'
              )
              .catch(
                function () {}
              );

          }
        );

      }

    })();
  </script>

</body>
</html>
